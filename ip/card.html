<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 900px; }
  body { font-family: 'Inter', Arial, sans-serif; color: #1c1c1c; background: #f6f1e7; }
  .card { width: 1200px; height: 900px; padding: 64px 72px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .card::after { content: ""; position: absolute; right: -180px; bottom: -220px; width: 640px; height: 640px; border-radius: 50%; background: #ffdd2d; opacity: .9; z-index: 0; }
  .card > * { position: relative; z-index: 1; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 800; font-size: 30px; letter-spacing: .5px; }
  .partner { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 500; color: #555; }
  .partner img { height: 64px; border-radius: 12px; }
  .city { margin-top: 56px; display: inline-block; align-self: flex-start; background: #1c1c1c; color: #fff; font-weight: 700; font-size: 30px; padding: 10px 22px; border-radius: 40px; }
  h1 { margin-top: 26px; font-size: 84px; line-height: 1.02; font-weight: 800; }
  h1 em { font-style: normal; background: #ffdd2d; padding: 0 12px; border-radius: 10px; }
  .sub { margin-top: 26px; font-size: 34px; font-weight: 500; color: #333; }
  .pills { margin-top: auto; display: flex; gap: 18px; flex-wrap: wrap; }
  .pill { background: #fff; border-radius: 22px; padding: 20px 26px; font-size: 28px; font-weight: 700; box-shadow: 0 2px 0 rgba(0,0,0,.05); }
  .steps { margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .step { background: #fff; border-radius: 24px; padding: 26px 28px; font-size: 28px; font-weight: 500; line-height: 1.25; }
  .step b { display: block; font-size: 44px; font-weight: 800; color: #1c1c1c; margin-bottom: 6px; }
  .big { font-size: 64px; }
</style></head>
<body>
<!--VARIANT-->
</body></html>
